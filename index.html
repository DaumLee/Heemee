<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heemee</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header>
      <h1>Heemee Audio Notes</h1>
      <p>Copyright @ 2026 Heemee. All rights reserved.</p>
      <div class="header-buttons">
        <button id="exportJsonBtn" class="json-btn" aria-label="Json">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2 .37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.01.08-2.11 0 0 .67-.21 2.2.82a7.6 7.6 0 012-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.91.08 2.11.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" fill="currentColor"/>
          </svg>
          내보내기
        </button>
        <button id="resetLocalBtn" class="reset-local-btn" type="button">로컬 초기화</button>
      </div>
    </header>

    <main>
      <section id="itemList" class="item-list"></section>
    </main>

    <footer class="site-credit">Made by daumlee</footer>
  </div>

  <button id="scrollTopBtn" class="scroll-top-btn" type="button" aria-label="맨 위로">↑</button>

  <template id="itemTemplate">
    <article class="item-card" draggable="true">
      <div class="item-header">
        <h2 class="item-title"></h2>
        <button type="button" class="item-toggle" aria-label="상세 보기 토글">
          <span class="item-chevron">▼</span>
        </button>
      </div>
      <div class="item-details">
        <!-- <div class="field-row audio-row">
          <label>재생</label>
          <audio controls class="audio-player"></audio>
        </div> -->
        <div class="field-row metronome-row">
          <label>메트로놈</label>
          <div class="metronome-controls">
            <button type="button" class="metronome-btn" aria-pressed="false">Play</button>
            <span class="metronome-bpm"></span>
          </div>
        </div>
        <textarea class="info" hidden readonly></textarea>
        <div class="field-row">
          <label>가사</label>
          <textarea class="lyrics" placeholder="가사를 입력하세요" readonly></textarea>
        </div>
        <div class="field-row">
          <label>주의사항</label>
          <textarea class="notes" placeholder="주의사항을 작성하세요"></textarea>
        </div>
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
