<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heemee</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header>
      <h1>Heemee Audio Notes</h1>
      <p>Copyright @ 2026 Heemee. All rights reserved.</p>
      <div class="header-buttons">
        <button id="exportJsonBtn" class="json-btn" aria-label="Json">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2 .37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.01.08-2.11 0 0 .67-.21 2.2.82a7.6 7.6 0 012-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.91.08 2.11.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" fill="currentColor"/>
          </svg>
          내보내기
        </button>
        <button id="resetLocalBtn" class="reset-local-btn" type="button">로컬 초기화</button>
        <button id="eighthNoteToggleBtn" class="eighth-note-toggle-btn" type="button" aria-label="8분 음표 전환" aria-pressed="false">
          <svg class="note-icon note-icon-quarter" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M13.2 4.2v12.2" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round"/>
            <ellipse cx="10" cy="17.1" rx="4.2" ry="2.9" transform="rotate(-24 10 17.1)" fill="currentColor"/>
          </svg>
          <svg class="note-icon note-icon-eighth" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12.8 4.2v12.2" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round"/>
            <path d="M12.8 4.2c3.4.3 5.1 1.5 5.1 3.7 0 1.3-.7 2.3-2.2 3.1" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"/>
            <ellipse cx="9.6" cy="17.1" rx="4.2" ry="2.9" transform="rotate(-24 9.6 17.1)" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </header>

    <main>
      <section id="itemList" class="item-list"></section>
    </main>

    <footer class="site-credit">Made by daumlee</footer>
  </div>

  <button id="scrollTopBtn" class="scroll-top-btn" type="button" aria-label="맨 위로">↑</button>

  <template id="itemTemplate">
    <article class="item-card" draggable="true">
      <div class="item-header">
        <h2 class="item-title"></h2>
        <div class="item-header-actions">
          <span class="item-bpm"></span>
          <button type="button" class="audio-toggle-btn" aria-label="오디오 재생" aria-pressed="false">
            <svg class="audio-play-icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5.5v13l10-6.5-10-6.5Z" fill="currentColor"/>
            </svg>
            <svg class="audio-stop-icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 7h10v10H7V7Z" fill="currentColor"/>
            </svg>
          </button>
          <button type="button" class="metronome-btn" aria-label="메트로놈 재생" aria-pressed="false">
            <svg class="metronome-icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9.2 3h5.6l4 17H5.2l4-17Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M12 6v10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M12 16l4-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M8.2 20h7.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
          <button type="button" class="item-toggle" aria-label="상세 보기 토글">
            <span class="item-chevron">▼</span>
          </button>
        </div>
      </div>
      <div class="item-details">
        <div class="field-row audio-row">
          <audio preload="metadata" class="audio-player"></audio>
          <div class="custom-audio-controls">
            <button type="button" class="audio-inline-toggle-btn" aria-label="오디오 재생" aria-pressed="false">
              <svg class="audio-play-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 5.5v13l10-6.5-10-6.5Z" fill="currentColor"/>
              </svg>
              <svg class="audio-stop-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 7h10v10H7V7Z" fill="currentColor"/>
              </svg>
            </button>
            <input type="range" class="audio-seek" min="0" max="100" value="0" step="0.1" aria-label="오디오 위치" />
            <span class="audio-time">0:00 / 0:00</span>
          </div>
        </div>
        <textarea class="info" hidden readonly></textarea>
        <div class="field-row">
          <label>가사</label>
          <textarea class="lyrics" placeholder="가사를 입력하세요" readonly></textarea>
        </div>
        <div class="field-row">
          <label>주의사항</label>
          <textarea class="notes" placeholder="주의사항을 작성하세요"></textarea>
        </div>
      </div>
    </article>
  </template>

  <script src="metronome.js"></script>
  <script src="script.js"></script>
</body>
</html>
